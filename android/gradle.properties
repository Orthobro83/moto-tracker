org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# The design forbids depending on Android Studio (design.md, 2026-08-16), so this
# must NOT point at the IDE's bundled JBR the way ../weather-android does. The
# system Temurin 26 is ahead of what AGP 9.3.2 supports; a supported JDK is
# installed separately and pinned here.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
